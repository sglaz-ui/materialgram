name: Build Telegram Desktop

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        run: |
          cd Telegram/build/prepare
          win.bat
        shell: cmd

      - name: Configure and build
        run: |
          cd Telegram
          configure.bat x64 -D TDESKTOP_API_ID=17349 -D TDESKTOP_API_HASH=344583e4570410f5e5f2f2e9a9a9a9a9
          cd ..
          msbuild out/Telegram.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /m
        shell: cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Desktop
          path: out/Release/Telegram.exe
