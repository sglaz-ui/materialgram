name: Build Telegram Desktop

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pywin32
        shell: cmd

      - name: Install dependencies
        run: |
          cd Telegram/build/prepare
          win.bat
        shell: cmd

      - name: Configure with CMake
        run: |
          cd Telegram
          mkdir out
          cd out
          cmake .. -G "Visual Studio 17 2022" -A x64 -D TDESKTOP_API_ID=17349 -D TDESKTOP_API_HASH=344583e4570410f5e5f2f2e9a9a9a9a9
        shell: cmd

      - name: Build
        run: |
          cd Telegram/out
          msbuild Telegram.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /m
        shell: cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Desktop
          path: out/Release/Telegram.exe
